name: Deploy Backend Arsipku

on:
  push:
    branches: [UAT]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show branch info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
      
      - name: Check secret exists
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY is EMPTY"
            exit 1
          else
            echo "✅ SSH_PRIVATE_KEY is PRESENT"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/gitea_runner_ci
          chmod 600 ~/.ssh/gitea_runner_ci
          ssh-keyscan -H 172.20.16.116 >> ~/.ssh/known_hosts

      - name: Validate SSH key
        run: |
          ssh-keygen -y -f ~/.ssh/gitea_runner_ci | ssh-keygen -lf -

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/gitea_runner_ci -o BatchMode=yes itqa@172.20.16.116 "echo SSH_OK"

      - name: Deploy to UAT
        if: ${{ github.ref_name == 'UAT' }}
        run: |
          echo "Deploying to UAT..."
          ssh -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/gitea_runner_ci \
              itqa@172.20.16.116 << 'EOF'

            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/itdev/projects/arsipku/arsipku-backend

            git pull origin UAT
            npm ci
            npm run build

            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js
            pm2 save
          EOF
