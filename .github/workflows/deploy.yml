name: Deploy Backend Arsipku

on:
  push:
    branches: [UAT]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # INFO
      # =====================
      - name: Show branch info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      # =====================
      # SETUP SSH
      # =====================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 172.20.16.116 >> ~/.ssh/known_hosts

      # =====================
      # DEPLOY
      # =====================
      - name: Deploy to UAT
        if: ${{ github.ref_name == 'UAT' }}
        run: |
          echo "Deploying to UAT..."
          ssh -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/id_ed25519 \
              itqa@172.20.16.116 << 'EOF'
          
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/itdev/projects/arsipku/arsipku-backend

            git pull origin UAT
            npm ci
            npm run build

            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js
            pm2 save
          EOF
